name: Pre-Delivery Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  pre-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend: install & checks
        working-directory: eda-call/backend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present

      - name: Frontend: install & build
        working-directory: eda-call/frontend
        run: |
          npm ci
          npm run build
